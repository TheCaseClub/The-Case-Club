<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catégories - The Case Club</title>
    <style>
        body { background-color: #000; color: #fff; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; text-align: center; }
        .header { padding: 50px 20px 30px; border-bottom: 1px solid rgba(201, 168, 76, 0.3); margin-bottom: 30px; }
        .gold { color: #C9A84C; text-transform: uppercase; letter-spacing: 3px; margin: 0; font-size: 22px; }
        .subtitle { color: #888; font-size: 12px; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }
        
        .cat-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            padding: 15px;
            max-width: 600px; 
            margin: 0 auto; 
        }
        
        .cat-card {
            background: linear-gradient(145deg, #0f0f0f, #050505);
            border: 1px solid #1a1a1a;
            padding: 25px 10px;
            border-radius: 16px;
            text-decoration: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .cat-card:active { transform: scale(0.92); border-color: #C9A84C; background: #111; }
        
        .cat-icon { font-size: 30px; margin-bottom: 12px; filter: drop-shadow(0 0 5px rgba(201, 168, 76, 0.2)); }
        .cat-name { color: #C9A84C; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; }
        
        .back-home {
            display: inline-block;
            margin: 40px 0 60px;
            color: #000;
            background-color: #C9A84C;
            text-decoration: none;
            font-size: 11px;
            padding: 15px 35px;
            border-radius: 30px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
            transition: 0.3s;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="gold">The Case Club</h1>
        <div class="subtitle">Catalogue des Collections</div>
    </div>

    <div class="cat-grid">
    <a href="index.html?filter=coques" class="cat-card">
        <span class="cat-icon">📱</span>
        <span class="cat-name">Coques</span>
    </a>
    <a href="index.html?filter=protection" class="cat-card">
        <span class="cat-icon">🛡️</span>
        <span class="cat-name">Écrans</span>
    </a>
    
    <a href="index.html?filter=chargeurs" class="cat-card">
        <span class="cat-icon">⚡</span>
        <span class="cat-name">Chargeurs</span>
    </a>
    <a href="index.html?filter=magsafe" class="cat-card">
        <span class="cat-icon">🧲</span>
        <span class="cat-name">MagSafe</span>
    </a>

    <a href="index.html?filter=audio" class="cat-card">
        <span class="cat-icon">🎧</span>
        <span class="cat-name">Audio</span>
    </a>
    <a href="index.html?filter=camera" class="cat-card">
        <span class="cat-icon">📸</span>
        <span class="cat-name">Caméra</span>
    </a>
</div>

    <a href="index.html" class="back-home">Retour à l'accueil</a>

</body>
</html>
